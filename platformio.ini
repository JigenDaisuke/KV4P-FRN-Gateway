; KV4P HT -> stand-alone FRN gateway firmware
; Same platform version as the official kv4p-ht firmware (Arduino-ESP32 2.0.17).

[platformio]
default_envs = kv4p

[env:kv4p]
platform = espressif32 @ 6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; two OTA app slots (~1.9 MB each), needed for the web firmware update
board_build.partitions = min_spiffs.csv
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_RUNNING_CORE=1
  -DARDUINO_EVENT_RUNNING_CORE=0
  -O2
build_unflags = -Os
; libgsm is vendored in lib/gsm (built with -DWAV49 by its library.json)

; After the first USB flash you can update over Wi-Fi:
;   pio run -e kv4p-ota -t upload   (edit upload_port with the gateway IP)
[env:kv4p-ota]
extends = env:kv4p
upload_protocol = custom
upload_port = frn-gateway.local
extra_scripts = tools/ota_upload.py
